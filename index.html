<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カレンダー</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f1f1f;
    --sub: #8a8a8a;
    --line: #ececec;
    --soft: #f5f5f5;
    --accent: #e5484d;
    --sun: #e5484d;
    --sat: #3a72d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #eeeeee;
      --sub: #8a8a8a;
      --line: #262626;
      --soft: #1c1c1c;
      --accent: #ff6369;
      --sun: #ff6369;
      --sat: #6c9cf0;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top) + 24px) 12px calc(env(safe-area-inset-bottom) + 96px);
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; color: var(--fg); -webkit-user-select: text; user-select: text; }

  /* ヘッダー */
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 10px; }
  .month { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .nav { display: flex; gap: 4px; align-items: center; }
  .icon-btn { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; font-size: 18px; color: var(--sub); }
  .icon-btn:active { background: var(--soft); }
  .text-btn { font-size: 14px; color: var(--sub); padding: 6px 10px; border-radius: 14px; }
  .text-btn:active { background: var(--soft); }

  /* カレンダー */
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .weekdays div { text-align: center; font-size: 11px; color: var(--sub); padding: 6px 0; }
  .weekdays div:first-child { color: var(--sun); }
  .weekdays div:last-child { color: var(--sat); }
  .cell {
    min-height: 78px; display: flex; flex-direction: column; align-items: stretch;
    padding: 3px 1px 4px; gap: 2px; border-top: 1px solid var(--line); overflow: hidden;
  }
  .num {
    width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center;
    font-size: 13px; margin: 0 auto 1px;
  }
  .cell.sun .num { color: var(--sun); }
  .cell.sat .num { color: var(--sat); }
  .cell.out .num { color: var(--line); }
  .cell.out .chip { opacity: .35; }
  .cell.today .num { color: var(--accent); font-weight: 700; }
  .cell.sel .num { background: var(--fg); color: var(--bg); font-weight: 700; }
  .chip {
    display: block; width: 100%; font-size: 9.5px; line-height: 14px; height: 14px;
    padding: 0 3px; border-radius: 3px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: left;
  }
  .chip b { font-weight: 600; }
  .more { font-size: 9px; color: var(--sub); text-align: center; line-height: 12px; }

  /* 選択日の予定 */
  .day { border-top: 1px solid var(--line); margin-top: 4px; padding: 16px 4px 0; }
  .day-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .ev { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; align-items: stretch; }
  .ev-bar { width: 4px; border-radius: 2px; flex: none; }
  .ev-time { width: 48px; flex: none; font-size: 13px; color: var(--sub); line-height: 1.4; font-variant-numeric: tabular-nums; white-space: pre; }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title { font-size: 15px; line-height: 1.4; word-break: break-word; }
  .ev-memo { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--sub); font-size: 14px; padding: 12px 0; }
  .add-line { color: var(--sub); font-size: 14px; padding: 14px 0; }

  /* 下部ボタン */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(transparent, var(--bg) 30%);
    display: flex; justify-content: center;
  }
  .shot-btn {
    background: var(--fg); color: var(--bg); border-radius: 24px;
    padding: 13px 22px; font-size: 15px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .shot-btn:active { opacity: .8; }

  /* ダイアログ */
  dialog {
    border: 0; padding: 0; width: 100%; max-width: 560px;
    margin: auto auto 0; border-radius: 18px 18px 0 0;
    background: var(--bg); color: var(--fg);
    max-height: 90vh;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .sheet { padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); overflow-y: auto; max-height: 90vh; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { font-size: 17px; margin: 0; }
  label { display: block; font-size: 12px; color: var(--sub); margin: 12px 0 4px; }
  .field {
    width: 100%; border: 1px solid var(--line); background: var(--soft);
    border-radius: 10px; padding: 10px 12px; font-size: 16px;
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; background: var(--soft); }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn.danger { color: var(--accent); }
  .btn:disabled { opacity: .4; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 10px; }

  /* 色の選択 */
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .color {
    width: 30px; height: 30px; border-radius: 15px; position: relative;
  }
  .color.on::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--fg);
  }

  /* 読み取り結果（チェックリスト） */
  .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .thumbs img { height: 80px; border-radius: 8px; border: 1px solid var(--line); }
  .select-all { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .select-all button { color: var(--sub); text-decoration: underline; }
  .cand { border-bottom: 1px solid var(--line); }
  .cand-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .check {
    width: 24px; height: 24px; flex: none; border-radius: 6px;
    border: 2px solid var(--sub); display: grid; place-items: center;
    color: var(--bg); font-size: 15px; font-weight: 700;
  }
  .cand.on .check { background: var(--fg); border-color: var(--fg); }
  .cand-bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .cand-main { flex: 1; min-width: 0; text-align: left; }
  .cand-when { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .cand-title { font-size: 15px; line-height: 1.4; word-break: break-word; }
  .cand:not(.on) .cand-main { opacity: .45; }
  .cand-edit-btn { font-size: 13px; color: var(--sub); padding: 6px 4px; flex: none; }
  .cand-detail { padding: 0 0 14px 36px; }
  .cand-detail .field { padding: 8px 10px; }
  .cand-detail label { margin-top: 8px; }
  .submit-bar { position: sticky; bottom: 0; background: var(--bg); padding-top: 12px; }

  .loading { text-align: center; padding: 32px 0; color: var(--sub); font-size: 14px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--fg);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="month" id="monthLabel"></div>
  <div class="nav">
    <button class="text-btn" id="todayBtn">今日</button>
    <button class="icon-btn" id="prevBtn" aria-label="前の月">‹</button>
    <button class="icon-btn" id="nextBtn" aria-label="次の月">›</button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙︎</button>
  </div>
</header>

<div class="weekdays">
  <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="grid" id="grid"></div>

<section class="day">
  <div class="day-title" id="dayTitle"></div>
  <div id="dayList"></div>
  <button class="add-line" id="addBtn">＋ 予定を追加</button>
</section>

<div class="bottom">
  <button class="shot-btn" id="shotBtn">スクショから追加</button>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<!-- 予定の追加・編集 -->
<dialog id="editDlg">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="editTitle">予定を追加</h2>
      <button class="icon-btn" data-close aria-label="閉じる">✕</button>
    </div>
    <label>タイトル</label>
    <input class="field" id="fTitle" placeholder="例：ゼミ">
    <label>日付</label>
    <input class="field" id="fDate" type="date">
    <div class="row">
      <div><label>開始</label><input class="field" id="fStart" type="time"></div>
      <div><label>終了</label><input class="field" id="fEnd" type="time"></div>
    </div>
    <label>色</label>
    <div class="colors" id="fColors"></div>
    <label>メモ</label>
    <textarea class="field" id="fMemo" rows="2" placeholder="場所など"></textarea>
    <div class="actions">
      <button class="btn danger" id="deleteBtn">削除</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
    <p class="note">時刻を空欄にすると終日の予定になります。</p>
  </div>
</dialog>

<!-- スクショの読み取り結果 -->
<dialog id="importDlg">
  <div class="sheet">
    <div class="sheet-head">
      <h2>読み取った予定</h2>
      <button class="icon-btn" data-close aria-label="閉じる">✕</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div id="importBody"></div>
    <div class="submit-bar" id="importActions" hidden>
      <div class="actions" style="margin-top:0">
        <button class="btn" data-close>キャンセル</button>
        <button class="btn primary" id="importAddBtn">追加</button>
      </div>
    </div>
  </div>
</dialog>

<!-- 設定 -->
<dialog id="settingsDlg">
  <div class="sheet">
    <div class="sheet-head">
      <h2>設定</h2>
      <button class="icon-btn" data-close aria-label="閉じる">✕</button>
    </div>
    <label>Claude APIキー</label>
    <input class="field" id="sKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label>モデル</label>
    <input class="field" id="sModel" placeholder="claude-haiku-5-5">
    <p class="note">APIキーはこの端末の中にだけ保存され、読み取り時にAnthropicのAPIへ直接送られます。</p>
    <div class="actions">
      <button class="btn primary" id="sSaveBtn">保存</button>
    </div>
    <label style="margin-top:24px">データ</label>
    <div class="actions" style="margin-top:4px">
      <button class="btn" id="exportBtn">書き出し</button>
      <button class="btn" id="importJsonBtn">読み込み</button>
    </div>
    <input type="file" id="jsonInput" accept="application/json,.json" hidden>
    <p class="note">予定はこの端末の中に保存されています。機種変更やデータ消去に備えて、ときどき書き出しておくと安心です。</p>
  </div>
</dialog>

<script>
// ===== 色 =====
const COLORS = [
  { id: "blue",   hex: "#3a72d8" },
  { id: "red",    hex: "#e5484d" },
  { id: "orange", hex: "#e8822e" },
  { id: "green",  hex: "#2f9e6a" },
  { id: "purple", hex: "#8e4ec6" },
  { id: "gray",   hex: "#7d7d7d" }
];
const DEFAULT_COLOR = "blue";
const colorHex = (id) => (COLORS.find((c) => c.id === id) || COLORS[0]).hex;

// 色を選ぶ丸ボタンを作る。onPick(id) で選んだ色を返す
function buildColorPicker(container, current, onPick) {
  container.innerHTML = "";
  for (const c of COLORS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "color" + (c.id === current ? " on" : "");
    b.style.background = c.hex;
    b.setAttribute("aria-label", c.id);
    b.onclick = () => {
      container.querySelectorAll(".color").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      onPick(c.id);
    };
    container.appendChild(b);
  }
}

// ===== 保存まわり =====
const KEY_EVENTS = "cal-events";
const KEY_API = "cal-apikey";
const KEY_MODEL = "cal-model";
const DEFAULT_MODEL = "claude-haiku-5-5";

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : JSON.parse(v);
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// {id, date:"YYYY-MM-DD", start:"HH:MM", end:"HH:MM", title, memo, color}
let events = load(KEY_EVENTS, []).map((e) => ({ color: DEFAULT_COLOR, ...e }));
function persist() { save(KEY_EVENTS, events); }

// ===== 日付ユーティリティ =====
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return "日付なし";
  const d = parseYmd(s);
  return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`;
}
function fmtTime(e) {
  if (!e.start) return "終日";
  return e.end ? `${e.start}〜${e.end}` : e.start;
}

// 終日の予定を先に、そのあと開始時刻順
function eventsOn(date) {
  return events
    .filter((e) => e.date === date)
    .sort((a, b) => (a.start || "").localeCompare(b.start || ""));
}

// ===== 画面描画 =====
let viewYear, viewMonth; // 表示中の年・月(0始まり)
let selected = todayStr();
const MAX_CHIPS = 3;

const $ = (id) => document.getElementById(id);

function render() {
  $("monthLabel").textContent = `${viewYear}年${viewMonth + 1}月`;
  const grid = $("grid");
  grid.innerHTML = "";
  const first = new Date(viewYear, viewMonth, 1);
  const start = new Date(viewYear, viewMonth, 1 - first.getDay());
  const today = todayStr();

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = ymd(d);
    const cell = document.createElement("button");
    cell.className = "cell";
    if (d.getMonth() !== viewMonth) cell.classList.add("out");
    if (d.getDay() === 0) cell.classList.add("sun");
    if (d.getDay() === 6) cell.classList.add("sat");
    if (ds === today) cell.classList.add("today");
    if (ds === selected) cell.classList.add("sel");

    const num = document.createElement("div");
    num.className = "num";
    num.textContent = d.getDate();
    cell.appendChild(num);

    const evs = eventsOn(ds);
    const shown = evs.length > MAX_CHIPS ? MAX_CHIPS - 1 : evs.length;
    for (const e of evs.slice(0, shown)) {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.style.background = colorHex(e.color);
      if (e.start) {
        const b = document.createElement("b");
        b.textContent = e.start;
        chip.append(b, " " + (e.title || ""));
      } else {
        chip.textContent = e.title || "（無題）";
      }
      cell.appendChild(chip);
    }
    if (evs.length > shown) {
      const more = document.createElement("div");
      more.className = "more";
      more.textContent = `+${evs.length - shown}`;
      cell.appendChild(more);
    }

    cell.onclick = () => {
      selected = ds;
      if (d.getMonth() !== viewMonth) { viewYear = d.getFullYear(); viewMonth = d.getMonth(); }
      render();
    };
    grid.appendChild(cell);
  }
  renderDay();
}

function renderDay() {
  const d = parseYmd(selected);
  $("dayTitle").textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
  const list = $("dayList");
  list.innerHTML = "";
  const evs = eventsOn(selected);
  if (evs.length === 0) {
    list.innerHTML = '<div class="empty">予定はありません</div>';
    return;
  }
  for (const e of evs) {
    const row = document.createElement("button");
    row.className = "ev";
    const bar = document.createElement("div");
    bar.className = "ev-bar";
    bar.style.background = colorHex(e.color);
    const time = document.createElement("div");
    time.className = "ev-time";
    time.textContent = e.start ? (e.end ? `${e.start}\n〜${e.end}` : e.start) : "終日";
    const body = document.createElement("div");
    body.className = "ev-body";
    const t = document.createElement("div");
    t.className = "ev-title";
    t.textContent = e.title || "（無題）";
    body.appendChild(t);
    if (e.memo) {
      const m = document.createElement("div");
      m.className = "ev-memo";
      m.textContent = e.memo;
      body.appendChild(m);
    }
    row.append(bar, time, body);
    row.onclick = () => openEdit(e);
    list.appendChild(row);
  }
}

function goMonth(delta) {
  const d = new Date(viewYear, viewMonth + delta, 1);
  viewYear = d.getFullYear(); viewMonth = d.getMonth();
  render();
}

function jumpTo(date) {
  selected = date;
  const d = parseYmd(date);
  viewYear = d.getFullYear(); viewMonth = d.getMonth();
  render();
}

// ===== 予定の追加・編集 =====
let editingId = null;
let editingColor = DEFAULT_COLOR;

function openEdit(ev) {
  editingId = ev ? ev.id : null;
  editingColor = ev ? (ev.color || DEFAULT_COLOR) : DEFAULT_COLOR;
  $("editTitle").textContent = ev ? "予定を編集" : "予定を追加";
  $("fTitle").value = ev ? ev.title : "";
  $("fDate").value = ev ? ev.date : selected;
  $("fStart").value = ev ? ev.start : "";
  $("fEnd").value = ev ? ev.end : "";
  $("fMemo").value = ev ? ev.memo : "";
  buildColorPicker($("fColors"), editingColor, (id) => { editingColor = id; });
  $("deleteBtn").hidden = !ev;
  $("editDlg").showModal();
}

$("saveBtn").onclick = () => {
  const data = {
    title: $("fTitle").value.trim(),
    date: $("fDate").value,
    start: $("fStart").value,
    end: $("fEnd").value,
    memo: $("fMemo").value.trim(),
    color: editingColor
  };
  if (!data.date) { alert("日付を入れてください"); return; }
  if (editingId) {
    const i = events.findIndex((e) => e.id === editingId);
    if (i >= 0) events[i] = { ...events[i], ...data };
  } else {
    events.push({ id: uid(), ...data });
  }
  persist();
  $("editDlg").close();
  jumpTo(data.date);
};

$("deleteBtn").onclick = () => {
  if (!editingId) return;
  if (!confirm("この予定を削除しますか？")) return;
  events = events.filter((e) => e.id !== editingId);
  persist();
  $("editDlg").close();
  render();
};

// ===== スクショから読み取り =====
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => reject(new Error("画像を開けませんでした"));
    img.src = url;
  });
}

// 長辺1568pxに縮小してJPEGのbase64にする（送信量と料金を抑える）
function imageToBase64(img) {
  const MAX = 1568;
  const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
}

function buildPrompt() {
  const now = new Date();
  return `画像（スマホのスクリーンショット）から予定・イベント・締切を読み取ってください。

今日は ${ymd(now)}（${WD[now.getDay()]}曜日）です。
- 年が書かれていない日付は、今日以降で最も近いその日付の年にしてください。
- 「明日」「来週水曜」などの相対表現は今日を基準に具体的な日付にしてください。
- 時刻は24時間表記の "HH:MM" にしてください。時刻がなければ空文字にしてください。
- 終了時刻がわからなければ空文字にしてください。
- title は短く（例：「ゼミ」「歯医者」「レポート締切」）。場所や持ち物などの補足は memo に入れてください。
- 同じ予定を重複して出さないでください。
- 予定が見つからなければ events を空配列にしてください。

次のJSONだけを出力してください（説明文やコードブロックは不要）：
{"events":[{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","title":"...","memo":"..."}]}`;
}

async function extractEvents(base64List) {
  const key = load(KEY_API, "");
  const model = load(KEY_MODEL, "") || DEFAULT_MODEL;
  const content = base64List.map((b) => ({
    type: "image",
    source: { type: "base64", media_type: "image/jpeg", data: b }
  }));
  content.push({ type: "text", text: buildPrompt() });

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model,
      max_tokens: 8000,
      messages: [{ role: "user", content }]
    })
  });

  if (!res.ok) {
    let msg = `通信エラー（${res.status}）`;
    try {
      const err = await res.json();
      if (err?.error?.message) msg += `：${err.error.message}`;
    } catch {}
    if (res.status === 401) msg = "APIキーが正しくありません。設定を確認してください。";
    throw new Error(msg);
  }

  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("");
  const s = text.indexOf("{");
  const e = text.lastIndexOf("}");
  if (s < 0 || e < 0) throw new Error("読み取り結果を解釈できませんでした");
  const parsed = JSON.parse(text.slice(s, e + 1));
  const list = Array.isArray(parsed.events) ? parsed.events : [];
  return list
    .filter((x) => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date || ""))
    .map((x) => ({
      date: x.date,
      start: /^\d{2}:\d{2}$/.test(x.start || "") ? x.start : "",
      end: /^\d{2}:\d{2}$/.test(x.end || "") ? x.end : "",
      title: String(x.title || "").trim(),
      memo: String(x.memo || "").trim()
    }));
}

// 読み取った候補 {date,start,end,title,memo,color,on,open}
let candidates = [];

function updateImportButton() {
  const n = candidates.filter((c) => c.on).length;
  const btn = $("importAddBtn");
  btn.textContent = n ? `選択した${n}件を追加` : "追加";
  btn.disabled = n === 0;
  const all = $("selectAllBtn");
  if (all) all.textContent = n === candidates.length ? "すべて解除" : "すべて選択";
  const count = $("selectCount");
  if (count) count.textContent = `${candidates.length}件見つかりました（${n}件選択中）`;
}

function renderCandidates() {
  const body = $("importBody");
  body.innerHTML = "";
  $("importActions").hidden = false;

  if (candidates.length === 0) {
    body.innerHTML = '<div class="loading">予定が見つかりませんでした</div>';
    updateImportButton();
    return;
  }

  const head = document.createElement("div");
  head.className = "select-all";
  head.innerHTML = '<span id="selectCount"></span><button id="selectAllBtn"></button>';
  body.appendChild(head);
  head.querySelector("#selectAllBtn").onclick = () => {
    const allOn = candidates.every((c) => c.on);
    candidates.forEach((c) => { c.on = !allOn; });
    renderCandidates();
  };

  candidates.forEach((c) => {
    const box = document.createElement("div");
    box.className = "cand" + (c.on ? " on" : "");

    // 1行目：チェック・色・日時・タイトル・編集
    const row = document.createElement("div");
    row.className = "cand-row";
    const check = document.createElement("button");
    check.className = "check";
    check.textContent = "✓";
    const bar = document.createElement("div");
    bar.className = "cand-bar";
    bar.style.background = colorHex(c.color);
    const main = document.createElement("button");
    main.className = "cand-main";
    const when = document.createElement("div");
    when.className = "cand-when";
    when.textContent = `${fmtDate(c.date)}　${fmtTime(c)}`;
    const title = document.createElement("div");
    title.className = "cand-title";
    title.textContent = c.title || "（無題）";
    main.append(when, title);
    const editBtn = document.createElement("button");
    editBtn.className = "cand-edit-btn";
    editBtn.textContent = c.open ? "閉じる" : "編集";
    row.append(check, bar, main, editBtn);
    box.appendChild(row);

    const toggle = () => {
      c.on = !c.on;
      box.classList.toggle("on", c.on);
      updateImportButton();
    };
    check.onclick = toggle;
    main.onclick = toggle;
    editBtn.onclick = () => { c.open = !c.open; renderCandidates(); };

    // 2行目：編集欄（「編集」を押したときだけ表示）
    if (c.open) {
      const detail = document.createElement("div");
      detail.className = "cand-detail";
      detail.innerHTML = `
        <label>タイトル</label>
        <input class="field" data-k="title">
        <label>日付</label>
        <input class="field" type="date" data-k="date">
        <div class="row">
          <div><label>開始</label><input class="field" type="time" data-k="start"></div>
          <div><label>終了</label><input class="field" type="time" data-k="end"></div>
        </div>
        <label>色</label>
        <div class="colors"></div>
        <label>メモ</label>
        <input class="field" data-k="memo">`;
      detail.querySelectorAll("[data-k]").forEach((inp) => {
        inp.value = c[inp.dataset.k];
        inp.oninput = () => {
          c[inp.dataset.k] = inp.value;
          when.textContent = `${fmtDate(c.date)}　${fmtTime(c)}`;
          title.textContent = c.title || "（無題）";
        };
      });
      buildColorPicker(detail.querySelector(".colors"), c.color, (id) => {
        c.color = id;
        bar.style.background = colorHex(id);
      });
      box.appendChild(detail);
    }

    body.appendChild(box);
  });
  updateImportButton();
}

async function handleFiles(files) {
  if (!files.length) return;
  if (!load(KEY_API, "")) {
    alert("先に設定（⚙︎）でAPIキーを入れてください");
    openSettings();
    return;
  }
  candidates = [];
  $("thumbs").innerHTML = "";
  $("importActions").hidden = true;
  $("importBody").innerHTML = '<div class="loading"><div class="spinner"></div>読み取り中…</div>';
  $("importDlg").showModal();

  try {
    const b64 = [];
    for (const f of files) {
      const { img, url } = await fileToImage(f);
      const t = document.createElement("img");
      t.src = url;
      $("thumbs").appendChild(t);
      b64.push(imageToBase64(img));
    }
    const found = await extractEvents(b64);
    candidates = found.map((x) => ({ ...x, color: DEFAULT_COLOR, on: true, open: false }));
    renderCandidates();
  } catch (err) {
    $("importBody").innerHTML = "";
    const msg = document.createElement("div");
    msg.className = "loading";
    msg.textContent = err.message || "読み取りに失敗しました";
    $("importBody").appendChild(msg);
    $("importActions").hidden = false;
    $("importAddBtn").disabled = true;
  }
}

$("importAddBtn").onclick = () => {
  const picked = candidates.filter((c) => c.on && c.date);
  if (!picked.length) return;
  for (const c of picked) {
    events.push({
      id: uid(), date: c.date, start: c.start, end: c.end,
      title: c.title, memo: c.memo, color: c.color
    });
  }
  persist();
  $("importDlg").close();
  // いちばん早い日付の月を表示する
  const first = picked.map((c) => c.date).sort()[0];
  jumpTo(first);
};

$("shotBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  handleFiles(files);
};

// ===== 設定 =====
function openSettings() {
  $("sKey").value = load(KEY_API, "");
  $("sModel").value = load(KEY_MODEL, "") || DEFAULT_MODEL;
  $("settingsDlg").showModal();
}
$("settingsBtn").onclick = openSettings;
$("sSaveBtn").onclick = () => {
  save(KEY_API, $("sKey").value.trim());
  save(KEY_MODEL, $("sModel").value.trim() || DEFAULT_MODEL);
  $("settingsDlg").close();
};

// データの書き出し・読み込み（バックアップ用）
$("exportBtn").onclick = async () => {
  const json = JSON.stringify({ version: 2, events }, null, 2);
  const name = `calendar-${todayStr()}.json`;
  const file = new File([json], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = name;
  a.click();
};
$("importJsonBtn").onclick = () => $("jsonInput").click();
$("jsonInput").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.events;
    if (!Array.isArray(list)) throw new Error();
    if (!confirm(`${list.length}件の予定を読み込みます。今の予定は置き換えられます。よろしいですか？`)) return;
    events = list.map((x) => ({
      id: x.id || uid(), date: x.date, start: x.start || "", end: x.end || "",
      title: x.title || "", memo: x.memo || "", color: x.color || DEFAULT_COLOR
    }));
    persist();
    render();
    $("settingsDlg").close();
  } catch {
    alert("ファイルを読み込めませんでした");
  }
};

// ===== 共通 =====
document.querySelectorAll("[data-close]").forEach((b) => {
  b.onclick = () => b.closest("dialog").close();
});
// 背景タップで閉じる
document.querySelectorAll("dialog").forEach((dlg) => {
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
});

$("prevBtn").onclick = () => goMonth(-1);
$("nextBtn").onclick = () => goMonth(1);
$("todayBtn").onclick = () => jumpTo(todayStr());
$("addBtn").onclick = () => openEdit(null);

// 左右スワイプで月移動
let touchX = null, touchY = null;
$("grid").addEventListener("touchstart", (e) => {
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
$("grid").addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) goMonth(dx < 0 ? 1 : -1);
  touchX = null;
});

// 初期表示
jumpTo(todayStr());

// オフライン対応
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
